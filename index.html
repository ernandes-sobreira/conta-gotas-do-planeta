<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Conta-Gotas do Planeta</title>
<style>
  :root{--ink:#0f2533;--soft:#5b7383;--line:#dbe9f1;--main:#0284c7;--deep:#0369a1;--dark:#0c4a6e;--hid:#7c3aed}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:#fff;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:12px 14px 30px}
  .top{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center}
  .hub{display:inline-flex;align-items:center;gap:6px;color:var(--deep);text-decoration:none;font-weight:600;font-size:.85rem;padding:6px 11px;border-radius:20px;border:1.5px solid var(--line)}
  .hub svg{width:13px;height:13px}
  h1{font-size:1.5rem;font-weight:900;color:var(--dark);margin:10px 0 2px;text-align:center}
  h1 span{color:var(--main)}
  .app{width:min(560px,100%)}
  .meter{display:flex;align-items:center;gap:12px;margin:10px 0 14px;padding:10px 14px;border-radius:18px;background:#f0f9ff;border:2px solid #bae6fd}
  .tank{width:34px;height:46px;border:3px solid var(--main);border-top-width:2px;border-radius:4px 4px 10px 10px;position:relative;overflow:hidden;flex:none;background:#fff}
  .tank i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#38bdf8,#0284c7);transition:height .4s}
  .meter b{font-size:1.6rem;color:var(--dark);font-weight:900;line-height:1}
  .meter small{display:block;font-size:.78rem;color:var(--soft);font-weight:600}
  .dots{display:flex;gap:5px;margin-left:auto}
  .dots i{width:8px;height:8px;border-radius:50%;background:#cfe6f3}
  .dots i.on{background:var(--main)}
  .q{border:2px solid var(--line);border-radius:22px;padding:18px 16px;text-align:center;animation:in .3s ease}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .q .ico{font-size:2.6rem;line-height:1}
  .q h2{font-size:1.25rem;color:var(--dark);margin:8px 0 14px;display:flex;align-items:center;justify-content:center;gap:8px}
  .q h3{font-size:.95rem;color:var(--soft);margin:14px 0 8px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
  .opt{border:2.5px solid var(--line);background:#fff;border-radius:16px;padding:12px 6px;cursor:pointer;font:inherit;color:var(--ink);font-weight:700;font-size:.95rem;transition:.15s}
  .opt span{display:block;font-size:1.7rem;margin-bottom:2px}
  .opt small{display:block;font-size:.72rem;color:var(--soft);font-weight:600;margin-top:2px}
  .opt.on{border-color:var(--main);background:#e0f2fe;transform:scale(1.03)}
  .opt.h.on{border-color:var(--hid);background:#f3e8ff}
  .nav{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
  .btn{background:var(--main);color:#fff;border:0;padding:12px 22px;border-radius:14px;font-weight:800;cursor:pointer;font-size:1rem;font-family:inherit}
  .btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--line)}
  .btn:disabled{opacity:.4}
  .help{width:26px;height:26px;border-radius:50%;border:2px solid var(--main);background:#fff;color:var(--main);font-weight:900;cursor:pointer;font-size:.9rem;flex:none;line-height:1}
  .memo{display:none;text-align:left;font-size:.84rem;line-height:1.5;color:var(--soft);background:#f8fafc;border-radius:12px;padding:10px 12px;margin-top:8px}
  .memo.on{display:block}
  .big{text-align:center;margin:6px 0 4px}
  .big b{font-size:3rem;font-weight:900;color:var(--dark);line-height:1}
  .big small{display:block;color:var(--soft);font-weight:700}
  .eq{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin:8px 0 2px;font-size:1.35rem}
  .eqt{text-align:center;font-size:.85rem;color:var(--soft);font-weight:600}
  .split{display:flex;height:16px;border-radius:9px;overflow:hidden;margin:14px 0 4px}
  .split i{display:block;height:100%}
  .leg{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700}
  .row{display:grid;grid-template-columns:32px 1fr auto 30px;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
  .row .e{font-size:1.4rem}
  .row .n{font-weight:700;font-size:.95rem}
  .row .bar{height:7px;background:#eef6fb;border-radius:4px;margin-top:4px;overflow:hidden}
  .row .bar i{display:block;height:100%;border-radius:4px}
  .row .v{font-weight:800;color:var(--dark);font-size:.95rem;white-space:nowrap}
  .row+.memo{margin:0 0 8px}
  .tip{margin-top:12px;background:#f0fdf4;border:2px solid #bbf7d0;border-radius:16px;padding:12px;font-size:.95rem;line-height:1.4}
  .tip b{color:#166534}
  footer{margin-top:20px;font-size:.78rem;color:var(--soft);text-align:center;line-height:1.6}
  footer .credit{font-weight:700;color:var(--ink)}
</style>
</head>
<body>
<div class="top"><a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/"><svg viewBox="0 0 16 16"><path d="M10 2 4 8l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Todos os jogos</a></div>
<h1>💧 Conta-Gotas <span>do Planeta</span></h1>
<div class="app">
  <div class="meter"><div class="tank"><i id="lvl"></i></div><div><b id="mL">0</b><small>litros por dia</small></div><div class="dots" id="dots"></div></div>
  <div id="main"></div>
</div>
<footer>Material educativo sobre pegada hídrica<br><span class="credit">Ernandes Sobreira</span> · UNEMAT Cáceres-MT</footer>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('pt-BR');
const br=n=>String(n).replace('.',',');
const SAB='Sabesp, dicas de economia de água';
const MEK='Mekonnen, Gerbens-Leenes e Hoekstra (2015): eletricidade na América Latina e Caribe, 4.842 m³ por TJ, cerca de 17 L por kWh';
const LKWH=17, TAR=0.83;
const WFN='Hoekstra (2010), médias mundiais da Water Footprint Network';

const Q=[
 {ico:'🚿',t:'Como é o seu chuveiro?',g:[
   {k:'chuv',o:[['⚡','Elétrico','',3],['🌊','Ducha ou aquecedor','',9]]},
   {k:'min',h:'Quanto tempo de banho?',o:[['','5 min','',5],['','10 min','',10],['','15 min','',15],['','20 min','',20]]},
   {k:'nb',h:'Banhos por dia',o:[['','1','',1],['','2','',2],['','3','',3]]}],
  memo:'Chuveiro elétrico: 45 L em 15 min, ou 3 L por minuto. Ducha com registro meio aberto: 135 L em 15 min, ou 9 L por minuto. Fonte: '+SAB+'.'},
 {ico:'🪥',t:'Ao escovar os dentes…',g:[
   {k:'torn',o:[['🚰','Deixo a torneira aberta','12 L',12],['✋','Fecho a torneira','0,5 L',0.5]]},
   {k:'esc',h:'Quantas vezes por dia?',o:[['','1','',1],['','2','',2],['','3','',3]]}],
  memo:'Escovar 5 minutos com a torneira aberta gasta cerca de 12 L. Molhando a escova e usando um copo, cerca de 0,5 L. Fonte: '+SAB+'.'},
 {ico:'🚽',t:'Como é a descarga?',g:[
   {k:'desc',o:[['🚽','Caixa acoplada','6,8 L',6.8],['🔘','Válvula na parede','cerca de 12 L',12]]},
   {k:'nd',h:'Descargas por dia',o:[['','3','',3],['','5','',5],['','8','',8]]}],
  memo:'Bacia com caixa acoplada nova: até 6,8 L por descarga (ABNT NBR 15097). Válvula de parede aberta por 6 segundos: de 10 a 14 L, usamos 12 L. Fonte: '+SAB+'.'},

 {ico:'⚡',t:'Sua conta de luz',g:[
   {k:'pes',h:'Pessoas na casa',o:[['','1','',1],['','2','',2],['','3 ou 4','',3.5],['','5 ou mais','',5]]},
   {k:'kwh',h:'Consumo no mês (olhe o kWh na conta)',o:[['','Até 100 kWh','até R$ 83',80],['','100 a 200','R$ 83 a 166',150],['','200 a 350','R$ 166 a 290',275],['','Mais de 350','mais de R$ 290',450]]}],
  memo:'Gerar eletricidade gasta água: evaporação nos lagos das hidrelétricas e resfriamento das térmicas. Na América Latina e Caribe a média é de 4.842 m³ por TJ, cerca de 17 L por kWh (Mekonnen et al., 2015). A conta da casa é dividida pelas pessoas. Os valores em reais usam R$ 0,83 por kWh, que varia de estado para estado.'},
 {ico:'❄️',t:'Ar-condicionado e ventilador',g:[
   {k:'ar',h:'Horas de ar-condicionado por dia',o:[['','Não uso','',0],['','2 h','',2],['','4 h','',4],['','8 h ou mais','',8]]},
   {k:'vent',h:'Horas de ventilador por dia',o:[['','Não uso','',0],['','4 h','',4],['','8 h','',8],['','12 h ou mais','',12]]}],
  memo:'Pela tabela de consumo do Procel, um split de até 10.000 BTU gasta cerca de 4,74 kWh em 8 horas, ou 0,59 kWh por hora. Um ventilador gasta cerca de 0,07 kWh por hora. Cada kWh carrega cerca de 17 L de água (Mekonnen et al., 2015). Esse gasto já faz parte da sua conta de luz.'},
 {ico:'🤖',t:'Perguntas para inteligência artificial',g:[
   {k:'ia',h:'Por dia (ChatGPT, Gemini e outras)',o:[['','Nenhuma','',0],['','Umas 10','',10],['','Umas 30','',30],['','100 ou mais','',100]]}],
  memo:'O Google mediu um pedido de texto típico ao Gemini: 0,26 mL de água para resfriar o centro de dados e 0,24 Wh de energia. Essa energia, a 17 L por kWh, soma mais cerca de 4 mL. Total: cerca de 4,3 mL por pergunta. Imagens e vídeos gastam mais, mas ainda não há média publicada.'},
 {ico:'🥩',t:'Carne de boi na semana',h:true,g:[
   {k:'boi',o:[['🥗','Quase nunca','',0],['🍽️','1 ou 2 vezes','',1.5],['🍖','3 a 5 vezes','',4],['🥩','Todo dia','',7]]}],
  memo:'Uma porção de 200 g de carne bovina = 0,2 kg × 15.500 L/kg = 3.100 L. É a água da chuva e da irrigação que fez crescer o pasto e a ração, mais a água que o boi bebe. Fonte: '+WFN+'.'},
 {ico:'🍗',t:'Frango na semana',h:true,g:[
   {k:'frango',o:[['🥗','Quase nunca','',0],['🍽️','1 ou 2 vezes','',1.5],['🍗','3 a 5 vezes','',4],['🐔','Todo dia','',7]]}],
  memo:'Uma porção de 200 g de frango = 0,2 kg × 3.900 L/kg = 780 L. Fonte: '+WFN+'.'},
 {ico:'☕',t:'Café e leite por dia',h:true,g:[
   {k:'cafe',h:'Xícaras de café',o:[['','0','',0],['','1','',1],['','2 ou 3','',2.5],['','4 ou mais','',4]]},
   {k:'leite',h:'Copos de leite',o:[['','0','',0],['','1','',1],['','2','',2],['','3 ou mais','',3]]}],
  memo:'Xícara de café de 125 mL: cerca de 140 L. Copo de leite de 200 mL: cerca de 200 L. Fonte: '+WFN+'.'},
 {ico:'👕',t:'Roupas e sapatos novos no ano',h:true,g:[
   {k:'cami',h:'Camisetas de algodão',o:[['','0 a 2','',1],['','3 a 6','',4.5],['','7 a 12','',9.5],['','Mais de 12','',15]]},
   {k:'sap',h:'Sapatos de couro',o:[['','Nenhum','',0],['','1 par','',1],['','2 pares','',2],['','3 ou mais','',3]]}],
  memo:'Camiseta de algodão de 250 g: cerca de 2.700 L. Par de sapatos de couro: cerca de 8.000 L. O total do ano é dividido por 365 para dar litros por dia. Fonte: '+WFN+'.'}
];
const A={};Q.forEach(q=>q.g.forEach(g=>A[g.k]=null));
let step=0;

function calc(){
  const g=k=>A[k]??0;
  return [
    {e:'🚿',n:'Banho',d:true,v:g('chuv')*g('min')*g('nb'),m:`${g('min')} min × ${br(g('chuv'))} L/min × ${g('nb')} banho(s) = ${fmt(g('chuv')*g('min')*g('nb'))} L por dia. Fonte: ${SAB}.`},
    {e:'🪥',n:'Escovar os dentes',d:true,v:g('torn')*g('esc'),m:`${br(g('torn'))} L × ${g('esc')} vez(es) = ${br(+(g('torn')*g('esc')).toFixed(1))} L por dia. Fonte: ${SAB}.`},
    {e:'🚽',n:'Descarga',d:true,v:g('desc')*g('nd'),m:`${br(g('desc'))} L × ${g('nd')} descargas = ${fmt(g('desc')*g('nd'))} L por dia. Fontes: ABNT NBR 15097 e ${SAB}.`},
    (()=>{const casa=g('kwh')/g('pes')||0,clima=(g('ar')*0.59+g('vent')*0.07)*30,k=Math.max(casa,clima);
      return {e:'⚡',n:'Energia elétrica',v:k*LKWH/30,m:`${fmt(g('kwh'))} kWh por mês ÷ ${br(g('pes'))} pessoa(s) = ${fmt(casa)} kWh. Disso, ar-condicionado e ventilador são cerca de ${fmt(clima)} kWh. ${fmt(k)} kWh × 17 L ÷ 30 dias = ${fmt(k*LKWH/30)} L por dia. Fonte: ${MEK}.`};})(),
    {e:'🤖',n:'Inteligência artificial',v:g('ia')*0.00434,m:`${g('ia')} pergunta(s) × 4,3 mL = ${br((g('ia')*4.34/1000).toFixed(2))} L por dia. Fontes: Google (2025), relatório sobre o Gemini, e ${MEK}.`},
    {e:'🥩',n:'Carne de boi',v:g('boi')*3100/7,m:`${br(g('boi'))} porção(ões) por semana × 3.100 L ÷ 7 dias = ${fmt(g('boi')*3100/7)} L por dia. Fonte: ${WFN}.`},
    {e:'🍗',n:'Frango',v:g('frango')*780/7,m:`${br(g('frango'))} porção(ões) por semana × 780 L ÷ 7 dias = ${fmt(g('frango')*780/7)} L por dia. Fonte: ${WFN}.`},
    {e:'☕',n:'Café e leite',v:g('cafe')*140+g('leite')*200,m:`${br(g('cafe'))} xícara(s) × 140 L + ${g('leite')} copo(s) × 200 L = ${fmt(g('cafe')*140+g('leite')*200)} L por dia. Fonte: ${WFN}.`},
    {e:'👕',n:'Roupas e sapatos',v:(g('cami')*2700+g('sap')*8000)/365,m:`(${br(g('cami'))} camiseta(s) × 2.700 L + ${g('sap')} par(es) × 8.000 L) ÷ 365 dias = ${fmt((g('cami')*2700+g('sap')*8000)/365)} L por dia. Fonte: ${WFN}.`}
  ];
}
function medidor(){
  const t=calc().reduce((s,x)=>s+x.v,0);
  $('mL').textContent=fmt(t);$('lvl').style.height=Math.min(100,t/60)+'%';
  $('dots').innerHTML=Q.map((_,i)=>`<i class="${i<step?'on':''}"></i>`).join('')+`<i class="${step>=Q.length?'on':''}"></i>`;
}
function toggle(id){$(id).classList.toggle('on');}

function render(){
  medidor();
  if(step>=Q.length)return resultado();
  const q=Q[step];
  $('main').innerHTML=`<div class="q"><div class="ico">${q.ico}</div>
    <h2>${q.t}<button class="help" onclick="toggle('mq')" aria-label="Como calculamos">?</button></h2>
    <div class="memo" id="mq">${q.memo}</div>
    ${q.g.map(g=>`${g.h?`<h3>${g.h}</h3>`:''}<div class="opts">${g.o.map((o,i)=>`<button class="opt${q.h?' h':''}${A[g.k]===o[3]?' on':''}" data-k="${g.k}" data-i="${i}">${o[0]?`<span>${o[0]}</span>`:''}${o[1]}${o[2]?`<small>${o[2]}</small>`:''}</button>`).join('')}</div>`).join('')}
    <div class="nav"><button class="btn ghost" id="bV" ${step?'':'style="visibility:hidden"'}>Voltar</button><button class="btn" id="bP" ${q.g.every(g=>A[g.k]!==null)?'':'disabled'}>${step===Q.length-1?'Ver resultado':'Próxima'}</button></div></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const g=q.g.find(x=>x.k===b.dataset.k);A[g.k]=g.o[+b.dataset.i][3];
    const auto=q.g.length===1;render();
    if(auto)setTimeout(()=>{if(Q[step]===q){step++;render();}},350);
  });
  $('bP').onclick=()=>{step++;render();};$('bV').onclick=()=>{step--;render();};
}
function resultado(){
  const r=calc(),t=r.reduce((s,x)=>s+x.v,0),dir=r.filter(x=>x.d).reduce((s,x)=>s+x.v,0),hid=t-dir,mx=Math.max(...r.map(x=>x.v),1);
  const baldes=Math.round(t/20);
  const top=[...r].sort((a,b)=>b.v-a.v)[0];
  const dicas={'Carne de boi':`Trocar ${br(Math.min(2,A.boi||0))} porção(ões) de boi por frango na semana poupa <b>${fmt(Math.min(2,A.boi||0)*(3100-780)/7)} L por dia</b> de água escondida.`,
    'Banho':`Cortar 5 minutos do banho poupa <b>${fmt(5*(A.chuv||3)*(A.nb||1))} L por dia</b>.`,
    'Café e leite':'Uma xícara de chá fica em cerca de 30 L, bem menos que o café.',
    'Roupas e sapatos':'Usar a roupa por mais tempo é o jeito mais fácil de reduzir essa parte.',
    'Descarga':'Uma caixa acoplada gasta cerca da metade de uma válvula de parede.',
    'Escovar os dentes':'Fechar a torneira derruba esse gasto para quase zero.',
    'Frango':'Feijão, arroz e ovos também reduzem a água escondida da refeição.',
    'Energia elétrica':'Trocar o ar-condicionado pelo ventilador corta cerca de 90% da energia do aparelho, e a água vai junto.',
    'Inteligência artificial':'Cada pergunta gasta pouco, mas bilhões de perguntas por dia pesam onde ficam os centros de dados.'};
  $('main').innerHTML=`<div class="q">
    <div class="big"><b>${fmt(t)}</b><small>litros de água por dia</small></div>
    <div class="eq">${'🪣'.repeat(Math.min(baldes,40))}${baldes>40?' …':''}</div>
    <div class="eqt">= ${fmt(baldes)} baldes de 20 litros, todo dia</div>
    <div class="split"><i style="width:${t?dir/t*100:0}%;background:#0284c7"></i><i style="width:${t?hid/t*100:0}%;background:#7c3aed"></i></div>
    <div class="leg"><span style="color:#0369a1">💧 Você vê: ${fmt(dir)} L</span><span style="color:#7c3aed">🔍 Escondida: ${fmt(hid)} L</span></div>
    <div style="margin-top:12px;text-align:left">${r.map((x,i)=>`<div class="row"><span class="e">${x.e}</span><div><div class="n">${x.n}</div><div class="bar"><i style="width:${x.v/mx*100}%;background:${x.d?'#0284c7':'#7c3aed'}"></i></div></div>
      <span class="v">${x.v>0&&x.v<1?br(x.v.toFixed(2)):fmt(x.v)} L</span><button class="help" onclick="toggle('m${i}')" aria-label="Memória de cálculo">?</button></div><div class="memo" id="m${i}">${x.m}</div>`).join('')}</div>
    <h3 style="margin:16px 0 6px;font-size:1rem;color:#0c4a6e;display:flex;align-items:center;justify-content:center;gap:8px">🌍 Você e o mundo<button class="help" onclick="toggle('mw')" aria-label="Explicação">?</button></h3>
    <div class="memo" id="mw">Pegada hídrica completa por pessoa, em litros por dia: média de 1996 a 2005, convertida de m³ por ano. Mundo 1.385, EUA 2.842, China 1.071 e Índia 1.089 m³ por ano (Hoekstra e Mekonnen, 2012, PNAS). Brasil 2.027 m³ por ano (Mekonnen e Hoekstra, 2011). Esses números incluem tudo o que um país consome. A sua conta aqui inclui só alguns itens, então a sua barra é um piso.</div>
    ${(()=>{const W=[['📍 Você (parte)',t,'#ef4444'],['🇺🇸 EUA',2842e3/365,'#94a3b8'],['🇧🇷 Brasil',2027e3/365,'#22c55e'],['🌍 Mundo',1385e3/365,'#0284c7'],['🇮🇳 Índia',1089e3/365,'#94a3b8'],['🇨🇳 China',1071e3/365,'#94a3b8']].sort((a,b)=>b[1]-a[1]);
      const m=W[0][1];return W.map(w=>`<div style="display:grid;grid-template-columns:120px 1fr 62px;gap:8px;align-items:center;margin:5px 0;text-align:left"><span style="font-weight:700;font-size:.88rem">${w[0]}</span><div style="height:12px;background:#eef6fb;border-radius:6px;overflow:hidden"><i style="display:block;height:100%;width:${w[1]/m*100}%;background:${w[2]};border-radius:6px"></i></div><span style="font-weight:800;font-size:.88rem;text-align:right">${fmt(w[1])} L</span></div>`).join('');})()}
    <div class="tip">💡 Seu maior gasto: <b>${top.n}</b>. ${dicas[top.n]}</div>
    <div class="nav"><button class="btn ghost" id="bV">Voltar</button><button class="btn" id="bR">Refazer</button></div></div>`;
  $('bV').onclick=()=>{step--;render();};$('bR').onclick=()=>{Object.keys(A).forEach(k=>A[k]=null);step=0;render();};
}
render();
</script>
</body>
</html>
